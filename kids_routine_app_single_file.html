<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Mijn Routine</title>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#242424;--muted:#777;--line:#e4ded2;--soft:#f1eee7;--accent:#111;--done:#dff3df;--todo:#fffdf8;--danger:#b9362b;--time:#fff1c7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;font-weight:750;cursor:pointer}button.primary{background:var(--accent);color:white}button.danger{color:var(--danger);border-color:#efc8c2}button.small{padding:7px 10px;font-size:.9rem}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 12px}label{display:block;margin:12px 0 6px;font-weight:750}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:950}.mark{width:48px;height:48px;border-radius:16px;background:white;display:grid;place-items:center;box-shadow:0 8px 24px #0001}.actions{display:flex;flex-wrap:wrap;gap:8px}.muted{color:var(--muted)}.screen{display:none}.screen.on{display:block}.panel,.box{background:white;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 10px 30px #0001}.panel{display:none;margin-bottom:18px;background:#fbfaf7}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.section:first-child{border-top:0;padding-top:0;margin-top:0}.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-top:24px}.kid{background:white;border:1px solid var(--line);border-radius:32px;min-height:220px;display:grid;place-items:center;text-align:center;padding:22px;box-shadow:0 10px 30px #0001;cursor:pointer}.kid:active{transform:scale(.98)}.kidIcon{width:120px;height:120px;border-radius:42px;background:var(--soft);display:grid;place-items:center;font-size:4rem;margin-bottom:14px}.kidName{font-size:1.55rem;font-weight:950}.seg{display:inline-flex;gap:6px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--soft);margin-top:6px}.seg button{border:0;background:transparent}.seg button.active{background:var(--accent);color:white}.title{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:clamp(1.5rem,5vw,2.2rem)}.titleIcon{width:56px;height:56px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:2rem}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 16px}.tab{background:var(--soft);font-weight:850}.tab.active{background:var(--accent);color:white}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.col{height:560px;border:1px dashed #cfc8bb;border-radius:28px;background:var(--todo);padding:14px;display:flex;flex-direction:column;overflow:hidden}.col.done{background:var(--done)}.col h2{display:flex;justify-content:space-between;margin:0 0 12px}.list{display:flex;flex-direction:column;gap:10px;min-height:0;flex:1;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}.list::-webkit-scrollbar{display:none}.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:white;border:1px solid var(--line);border-radius:22px;padding:12px;box-shadow:0 6px 18px #0001;user-select:none}.task.drag{cursor:grab}.task.dragging{opacity:.45}.ico{width:56px;height:56px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:2rem}.taskName{font-size:1.15rem;font-weight:900}.timer{min-width:52px;height:42px;border-radius:14px;background:var(--soft)}.timer.running{background:var(--accent);color:white}.timer.timeup{background:var(--time)}.empty{min-height:100px;display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:750}.row{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.doneMsg{display:none;margin-top:14px;background:var(--done);border-radius:20px;padding:14px;text-align:center;font-weight:950}.doneMsg.on{display:block}.task.doneState{border-color:#9fcf9f;background:#fbfffb}.task.doneState .ico{background:#eaf7ea}.celebrations{display:none;position:fixed;inset:0;z-index:20;background:transparent;pointer-events:none;padding:18px;overflow:hidden}.celebrations.on{display:block}.celebrations::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 75% 25%,#fff9 0 2px,transparent 3px),radial-gradient(circle at 55% 70%,#fff8 0 2px,transparent 3px);background-size:90px 90px;animation:twinkle 1.4s infinite alternate}.celebrations.theme-rainbow{background:linear-gradient(180deg,#1b1464 0%,#4b2fbf 42%,#ffb7e8 100%)}.celebrations.theme-space{background:radial-gradient(circle at 30% 20%,#392c7d,#07051f 65%)}.celebrations.theme-ocean{background:linear-gradient(180deg,#75d5ff 0%,#0677a7 55%,#03475f 100%)}.celebrations.theme-jungle{background:linear-gradient(180deg,#b9fbc0 0%,#49a078 52%,#1b4332 100%)}.celebrations.theme-royal{background:linear-gradient(180deg,#ffd6ff 0%,#c77dff 48%,#7b2cbf 100%)}.rainbow{position:absolute;left:50%;bottom:10%;width:120vw;height:60vw;max-height:520px;transform:translateX(-50%);border-radius:999px 999px 0 0;background:repeating-radial-gradient(ellipse at center bottom,#ff4d6d 0 16px,#ffd166 16px 32px,#06d6a0 32px 48px,#4cc9f0 48px 64px,#9b5de5 64px 80px,transparent 80px 104px);opacity:.75}.firework{position:absolute;width:9px;height:9px;border-radius:50%;background:white;box-shadow:0 -70px #fff,50px -50px #ffd166,70px 0 #ff4d6d,50px 50px #06d6a0,0 70px #4cc9f0,-50px 50px #f15bb5,-70px 0 #fee440,-50px -50px #9b5de5;animation:boom 1.2s ease-in-out infinite}.unicorn{position:absolute;font-size:4rem;animation:jump 1.15s ease-in-out infinite;filter:drop-shadow(0 12px 12px #0004)}.unicorn.u1{left:7%;bottom:13%;animation-delay:.05s}.unicorn.u2{right:8%;bottom:16%;animation-delay:.32s}.unicorn.u3{left:42%;bottom:8%;animation-delay:.58s}.themeObj{position:absolute;font-size:4rem;animation:jump 1.2s ease-in-out infinite;filter:drop-shadow(0 12px 12px #0004)}.themeObj.o1{left:7%;bottom:13%;animation-delay:.05s}.themeObj.o2{right:8%;bottom:16%;animation-delay:.32s}.themeObj.o3{left:42%;bottom:8%;animation-delay:.58s}.planet{position:absolute;border-radius:50%;width:130px;height:130px;left:8%;bottom:12%;background:radial-gradient(circle at 35% 30%,#fff,#ffcf56 30%,#f77f00);box-shadow:0 0 40px #ffd166}.waves{position:absolute;left:0;right:0;bottom:0;height:30vh;background:repeating-radial-gradient(ellipse at 50% 120%,#caf0f8 0 18px,#48cae4 18px 36px,#0096c7 36px 54px);opacity:.8}.jungleHill{position:absolute;left:-5vw;right:-5vw;bottom:-6vh;height:34vh;background:radial-gradient(ellipse at 20% 100%,#2d6a4f 0 34%,transparent 35%),radial-gradient(ellipse at 55% 100%,#1b4332 0 38%,transparent 39%),radial-gradient(ellipse at 85% 100%,#40916c 0 32%,transparent 33%)}.castle{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);font-size:7rem;filter:drop-shadow(0 14px 16px #0004)}.starRain{position:absolute;top:-40px;font-size:2rem;animation:rain 3.5s linear infinite;filter:drop-shadow(0 8px 8px #0004)}.skyMsg{position:absolute;left:50%;top:18%;transform:translateX(-50%) rotate(-2deg);z-index:4;max-width:min(90vw,760px);text-align:center;font-size:clamp(2.4rem,9vw,6rem);font-weight:1000;line-height:.95;color:white;text-shadow:0 0 8px #fff,0 0 18px #ffd166,0 0 36px #ff4d6d,0 8px 18px #0008;animation:skyPulse 1.4s ease-in-out infinite alternate}.skyMsg::before,.skyMsg::after{content:'✨';position:absolute;font-size:.45em;top:-.45em;animation:jump 1.2s ease-in-out infinite}.skyMsg::before{left:-.75em}.skyMsg::after{right:-.75em;animation-delay:.4s}.closeCelebration{pointer-events:auto;position:fixed;right:18px;top:18px;z-index:5;background:white;color:var(--ink);box-shadow:0 10px 30px #0002}@keyframes skyPulse{from{transform:translateX(-50%) rotate(-2deg) scale(1)}to{transform:translateX(-50%) rotate(2deg) scale(1.04)}}@keyframes twinkle{from{opacity:.45}to{opacity:.9}}@keyframes boom{0%,100%{transform:scale(.35);opacity:.25}45%{transform:scale(1.25);opacity:1}}@keyframes jump{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-32px) rotate(6deg)}}@keyframes rain{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(115vh) rotate(500deg);opacity:0}}dialog{border:0;border-radius:28px;box-shadow:0 20px 60px #0003;padding:0;width:min(92vw,520px)}dialog::backdrop{background:#0005}.modal{padding:20px;background:white;border-radius:28px}.modal h2{margin-top:0}.modalActions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:760px){.cols{grid-template-columns:1fr}.col{height:520px}}@media(max-width:520px){.app{padding:12px}.task{grid-template-columns:auto 1fr}.timer{grid-column:1/-1;width:100%}.row{grid-template-columns:1fr}.kidIcon{width:100px;height:100px;font-size:3.3rem}}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div class="brand"><span class="mark">☀️</span><span>Mijn Routine</span></div>
    <div class="actions"><button id="homeBtn" class="small">Kinderen</button><button id="parentBtn" class="small">Ouder</button></div>
  </div>

  <section id="panel" class="panel">
    <h2>Ouder instellingen</h2>
    <p id="ctx" class="muted"></p>
    <div class="grid">
      <section class="section"><h3>Kind</h3><div class="actions"><button id="addChild" class="small">+ Kind</button><button id="editChild" class="small">Wijzig kind</button><button id="delChild" class="danger small">Verwijder kind</button></div><label>Taken verplaatsen</label><div class="seg"><button id="modeDrag" class="small" type="button">Slepen</button><button id="modeClick" class="small" type="button">Aanwijzen en klikken</button></div></section>
      <section class="section"><h3>Routine</h3><div class="actions"><button id="addRoutine" class="small">+ Routine</button><button id="editRoutine" class="small">Wijzig routine</button><button id="resetRoutine" class="small">Zet taken terug</button><button id="delRoutine" class="danger small">Verwijder routine</button></div><label>Berichten bij afronden</label><input id="routineMessage" placeholder="Slaap lekker! | Droom zacht!" /><p class="muted">Gebruik | voor variaties. Er wordt er willekeurig één gekozen.</p></section>
      <section class="section"><h3>Taak</h3><button id="addTask" class="primary small">+ Taak</button></section>
    </div>
    <section class="section"><h3>Taken in huidige routine</h3><div id="editor"></div></section>
  </section>

  <section id="home" class="screen on"><p class="muted">Kies wie er aan de routine begint.</p><div id="kids" class="kids"></div></section>

  <section id="routineScreen" class="screen"><div class="box"><h1 id="childTitle" class="title"></h1><div id="tabs" class="tabs"></div><div class="cols"><section class="col" data-status="todo"><h2><span>Te doen</span><span id="todoCount">0</span></h2><div id="todo" class="list" data-status="todo"></div></section><section class="col done" data-status="done"><h2><span>Klaar</span><span id="doneCount">0</span></h2><div id="done" class="list" data-status="done"></div></section></div><div id="doneMsg" class="doneMsg">Klaar! Goed gedaan! 🎉</div></div></section>
</main>
<div id="celebrations" class="celebrations" aria-hidden="true"></div>

<dialog id="childDialog"><form id="childForm" class="modal"><h2 id="childDialogTitle">Kind toevoegen</h2><label>Naam</label><input id="childName" placeholder="Frida" required><label>Icoon</label><input id="childIcon" placeholder="🦄" maxlength="4"><div class="modalActions"><button type="button" data-close="childDialog">Annuleer</button><button class="primary" type="submit">Bewaar</button></div></form></dialog>
<dialog id="routineDialog"><form id="routineForm" class="modal"><h2 id="routineDialogTitle">Routine toevoegen</h2><label>Naam routine</label><input id="routineName" placeholder="Ochtend, Na school, Slapen..." required><label>Berichten bij afronden</label><input id="routineDialogMessage" placeholder="Slaap lekker! | Droom zacht!"><div class="modalActions"><button type="button" data-close="routineDialog">Annuleer</button><button class="primary" type="submit">Bewaar</button></div></form></dialog>
<dialog id="taskDialog"><form id="taskForm" class="modal"><h2 id="taskDialogTitle">Taak toevoegen</h2><label>Taak</label><input id="taskName" placeholder="Tanden poetsen" required><label>Icoon</label><input id="taskIcon" placeholder="🪥" maxlength="4"><label>Timer in minuten, optioneel</label><input id="taskMinutes" type="number" min="0" max="120" placeholder="5"><div class="modalActions"><button type="button" data-close="taskDialog">Annuleer</button><button class="primary" type="submit">Bewaar</button></div></form></dialog>

<script>
'use strict';
const KEY='mijnRoutine.clean.v1';
let state,timer=null,D={};
const $=id=>document.getElementById(id);
const uid=()=>crypto&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const newTask=(name,icon,minutes)=>({id:uid(),name,icon,minutes:Number(minutes||0),status:'todo',timeUp:false});
function defaultState(){return{activeChildId:null,activeRoutineByChild:{},runningTimer:null,editMode:null,editingId:null,children:[{id:'frida',name:'Frida',icon:'🦄',moveMode:'drag',routines:[{id:'frida-ochtend',name:'Ochtend',messages:['Fijne dag op school!','Maak er een mooie dag van!','Veel plezier vandaag!','Je bent helemaal klaar voor de dag!'],tasks:[newTask('Aankleden','👕',5),newTask('Ontbijten','🥣',15),newTask('Tanden poetsen','🪥',3),newTask('Schooltas pakken','🎒',5)]},{id:'frida-slapen',name:'Slapen',messages:['Slaap lekker!','Droom zacht!','Welterusten, topper!','Lekker slapen, morgen weer een nieuwe dag!'],tasks:[newTask('Pyjama aan','🛌',5),newTask('Tanden poetsen','🪥',3),newTask('Tafels oefenen','✖️',10),newTask('Kleding voor morgen kiezen','👗',5),newTask('Lezen','📚',15)]}]},{id:'dante',name:'Dante',icon:'🦖',moveMode:'click',routines:[{id:'dante-ochtend',name:'Ochtend',messages:['Fijne dag!','Veel plezier vandaag!','Je bent klaar voor de dag!'],tasks:[newTask('Aankleden','👕',5),newTask('Ontbijten','🍞',15),newTask('Schoenen aan','👟',4)]}]},{id:'anahi',name:'Anahí',icon:'🐰',moveMode:'click',routines:[{id:'anahi-ochtend',name:'Ochtend',messages:['Fijne dag!','Veel plezier vandaag!','Je bent klaar voor de dag!'],tasks:[newTask('Aankleden','👗',5),newTask('Ontbijten','🥣',15),newTask('Jas aan','🧥',3)]}]}]};}
function normalize(s){s=s&&Array.isArray(s.children)?s:defaultState();s.activeRoutineByChild=s.activeRoutineByChild||s.activeRoutineIdByChild||{};s.runningTimer=null;s.editMode=null;s.editingId=null;s.children.forEach(c=>{c.id=c.id||uid();c.name=c.name||'Kind';c.icon=c.icon||'⭐';c.moveMode=c.moveMode==='click'?'click':'drag';c.routines=Array.isArray(c.routines)?c.routines:[];c.routines.forEach(r=>{r.id=r.id||uid();r.name=r.name||'Routine';r.messages=normalizeMessages(r.messages||r.message,r.name);delete r.message;r.tasks=Array.isArray(r.tasks)?r.tasks:[];r.tasks.forEach(t=>{t.id=t.id||uid();t.name=t.name||'Taak';t.icon=t.icon||'⭐';t.minutes=Number(t.minutes||0);t.status=t.status==='done'?'done':'todo';t.timeUp=Boolean(t.timeUp);});});});ensureFridaTask(s);if(s.activeChildId&&!s.children.some(c=>c.id===s.activeChildId))s.activeChildId=null;return s;}
function defaultRoutineMessages(name){const lower=String(name||'').toLowerCase();if(lower.includes('slapen')||lower.includes('bed'))return ['Slaap lekker!','Droom zacht!','Welterusten, topper!','Lekker slapen, morgen weer een nieuwe dag!'];if(lower.includes('ochtend'))return ['Fijne dag!','Veel plezier vandaag!','Je bent klaar voor de dag!','Maak er een mooie dag van!'];return ['Goed gedaan!','Super gedaan!','Klaar! Wat goed!'];}
function normalizeMessages(value,name){let arr=Array.isArray(value)?value:String(value||'').split('|');arr=arr.map(x=>String(x).trim()).filter(Boolean);return arr.length?arr:defaultRoutineMessages(name);}
function messagesToText(messages,name){return normalizeMessages(messages,name).join(' | ');}
function randomMessage(r){const arr=normalizeMessages(r&&r.messages,r&&r.name);return arr[Math.floor(Math.random()*arr.length)];}
function ensureFridaTask(s){const f=s.children.find(c=>c.id==='frida'||c.name==='Frida');if(!f)return;const r=f.routines.find(x=>x.id==='frida-slapen'||x.id==='slapen-frida'||x.name==='Slapen');if(!r)return;
  r.tasks.forEach(t=>{if(t.name==='Pyjama aan')t.icon='🛌';});
  let foundTafels=false,foundClothes=false;
  r.tasks=r.tasks.filter(t=>{const tafels=t.name==='Tafels oefenen'||t.name==='Multiplication tables practice';const clothes=t.name==='Kleding voor morgen kiezen'||t.name==='Choose tomorrow clothes';
    if(tafels){if(foundTafels)return false;foundTafels=true;t.name='Tafels oefenen';t.icon='✖️';t.minutes=t.minutes||10;return true;}
    if(clothes){if(foundClothes)return false;foundClothes=true;t.name='Kleding voor morgen kiezen';t.icon='👗';t.minutes=t.minutes||5;return true;}
    return true;
  });
  if(!foundTafels)r.tasks.push(newTask('Tafels oefenen','✖️',10));
  if(!foundClothes)r.tasks.push(newTask('Kleding voor morgen kiezen','👗',5));
  const tafelsIdx=r.tasks.findIndex(t=>t.name==='Tafels oefenen');
  const clothesIdx=r.tasks.findIndex(t=>t.name==='Kleding voor morgen kiezen');
  if(tafelsIdx>=0&&clothesIdx>=0&&clothesIdx!==tafelsIdx+1){const item=r.tasks.splice(clothesIdx,1)[0];const newTafelsIdx=r.tasks.findIndex(t=>t.name==='Tafels oefenen');r.tasks.splice(newTafelsIdx+1,0,item);}
}
function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'));}catch(e){console.warn(e);return defaultState();}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function clear(el){while(el.firstChild)el.removeChild(el.firstChild);}
function empty(text){const d=document.createElement('div');d.className='empty';d.textContent=text;return d;}
function cache(){['panel','ctx','home','routineScreen','kids','childTitle','tabs','todo','done','todoCount','doneCount','doneMsg','editor','childForm','routineForm','taskForm','celebrations'].forEach(id=>D[id]=$(id));}
function bind(){
$('homeBtn').onclick=showHome;$('parentBtn').onclick=()=>{D.panel.classList.toggle('on');renderPanel();};
$('addChild').onclick=()=>openChild('add');$('editChild').onclick=()=>openChild('edit');$('delChild').onclick=deleteChild;
$('modeDrag').onclick=()=>setMode('drag');$('modeClick').onclick=()=>setMode('click');
$('addRoutine').onclick=()=>openRoutine('add');$('editRoutine').onclick=()=>openRoutine('edit');$('resetRoutine').onclick=resetRoutine;$('delRoutine').onclick=deleteRoutine;
$('addTask').onclick=()=>openTask('add');D.childForm.onsubmit=submitChild;D.routineForm.onsubmit=submitRoutine;D.taskForm.onsubmit=submitTask;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{closeDialogs();setEdit(null);});
[D.todo,D.done].forEach(list=>{list.ondragover=e=>e.preventDefault();list.ondrop=e=>{e.preventDefault();moveTask(e.dataTransfer.getData('text/plain'),list.dataset.status);};});}
function child(){return state.children.find(c=>c.id===state.activeChildId)||null;}
function ensureChild(){let c=child();if(!c&&state.children[0]){c=state.children[0];state.activeChildId=c.id;}return c;}
function routine(){const c=child();if(!c)return null;const rid=state.activeRoutineByChild[c.id]||(c.routines[0]&&c.routines[0].id);const r=c.routines.find(x=>x.id===rid)||c.routines[0]||null;if(r)state.activeRoutineByChild[c.id]=r.id;return r;}
function ensureRoutine(){const c=ensureChild();if(!c)return null;let r=routine();if(!r){r={id:uid(),name:'Nieuwe routine',tasks:[]};c.routines.push(r);state.activeRoutineByChild[c.id]=r.id;}return r;}
function saveRender(){save();render();}
function showHome(){D.home.classList.add('on');D.routineScreen.classList.remove('on');saveRender();}
function showRoutine(){D.home.classList.remove('on');D.routineScreen.classList.add('on');saveRender();}
function render(){renderKids();renderRoutine();renderPanel();renderTimers();}
function renderKids(){clear(D.kids);if(!state.children.length){D.kids.appendChild(empty('Nog geen kinderen. Open Ouder instellingen en voeg een kind toe.'));return;}state.children.forEach(c=>{const card=document.createElement('article'),box=document.createElement('div'),ic=document.createElement('div'),nm=document.createElement('div');card.className='kid';ic.className='kidIcon';nm.className='kidName';ic.textContent=c.icon;nm.textContent=c.name;box.append(ic,nm);card.appendChild(box);card.onclick=()=>{state.activeChildId=c.id;if(!state.activeRoutineByChild[c.id]&&c.routines[0])state.activeRoutineByChild[c.id]=c.routines[0].id;showRoutine();};D.kids.appendChild(card);});}
function renderRoutine(){const c=child(),r=routine();clear(D.childTitle);clear(D.tabs);clear(D.todo);clear(D.done);if(!c){D.todoCount.textContent=D.doneCount.textContent='0';D.doneMsg.classList.remove('on');return;}const ic=document.createElement('span'),nm=document.createElement('span');ic.className='titleIcon';ic.textContent=c.icon;nm.textContent=c.name;D.childTitle.append(ic,nm);c.routines.forEach(x=>{const b=document.createElement('button');b.className='tab'+(r&&x.id===r.id?' active':'');b.textContent=x.name;b.onclick=()=>{state.activeRoutineByChild[c.id]=x.id;saveRender();};D.tabs.appendChild(b);});if(!r){D.tabs.appendChild(empty('Nog geen routine.'));D.todo.appendChild(empty('Vraag een ouder om een routine toe te voegen.'));D.done.appendChild(empty('Klaar komt hier.'));D.todoCount.textContent=D.doneCount.textContent='0';return;}const todo=r.tasks.filter(t=>t.status!=='done'),done=r.tasks.filter(t=>t.status==='done');todo.forEach(t=>D.todo.appendChild(taskCard(t)));done.forEach(t=>D.done.appendChild(taskCard(t)));if(!todo.length)D.todo.appendChild(empty('Sleep taken terug als je opnieuw wilt beginnen.'));if(!done.length)D.done.appendChild(empty('Sleep taken hierheen als ze klaar zijn.'));D.todoCount.textContent=todo.length;D.doneCount.textContent=done.length;D.doneMsg.classList.toggle('on',r.tasks.length>0&&!todo.length);}
function renderPanel(){const c=child(),r=routine(),on=D.routineScreen.classList.contains('on');D.ctx.textContent=c?'Je bewerkt nu: '+c.name+(r?' - '+r.name:' - geen routine geselecteerd'):'Kies eerst een kind. Daarna kun je routines en taken beheren.';$('routineMessage').disabled=!r;$('routineMessage').value=r?messagesToText(r.messages,r.name):'';$('routineMessage').onchange=()=>{const current=routine();if(!current)return;current.messages=normalizeMessages($('routineMessage').value,current.name);saveRender();};['editChild','delChild','addRoutine','addTask','modeDrag','modeClick'].forEach(id=>$(id).disabled=!c);['editRoutine','resetRoutine','delRoutine'].forEach(id=>$(id).disabled=!c||!r);$('modeDrag').classList.toggle('active',!!c&&c.moveMode!=='click');$('modeClick').classList.toggle('active',!!c&&c.moveMode==='click');clear(D.editor);if(!on||!c){D.editor.appendChild(empty('Kies eerst een kind om taken te bewerken.'));return;}if(!r){D.editor.appendChild(empty('Nog geen routine. Voeg eerst een routine toe.'));return;}if(!r.tasks.length){D.editor.appendChild(empty('Nog geen taken in deze routine.'));return;}r.tasks.forEach((t,i)=>D.editor.appendChild(editorRow(r,t,i)));}
function taskCard(t){const c=child(),mode=c&&c.moveMode==='click'?'click':'drag',card=document.createElement('article'),ic=document.createElement('div'),wrap=document.createElement('div'),name=document.createElement('div'),btn=document.createElement('button');card.className='task '+(mode==='drag'?'drag':'')+(t.status==='done'?' doneState':'');card.draggable=mode==='drag';ic.className='ico';ic.textContent=t.icon;name.className='taskName';name.textContent=t.name;wrap.appendChild(name);btn.className='timer';if(t.minutes>0){btn.dataset.timer=t.id;btn.textContent=t.timeUp?'Tijd!':t.minutes+':00';}else{btn.disabled=true;btn.textContent='-';}card.append(ic,wrap,btn);card.ondragstart=e=>{if(mode!=='drag')return;card.classList.add('dragging');e.dataTransfer.setData('text/plain',t.id);};card.ondragend=()=>card.classList.remove('dragging');btn.onclick=e=>{e.stopPropagation();if(t.minutes>0)toggleTimer(t.id);};card.onclick=e=>{if(e.target.closest('button')||mode!=='click')return;moveTask(t.id,t.status==='done'?'todo':'done');};return card;}
function editorRow(r,t,i){const row=document.createElement('div'),label=document.createElement('strong'),edit=document.createElement('button'),up=document.createElement('button'),del=document.createElement('button');row.className='row';label.textContent=t.icon+' '+t.name;edit.textContent='Wijzig';up.textContent='Omhoog';del.textContent='Verwijder';edit.className=up.className='small';del.className='danger small';edit.onclick=()=>openTask('edit',t.id);up.onclick=()=>{if(i<1)return;const item=r.tasks.splice(i,1)[0];r.tasks.splice(i-1,0,item);saveRender();};del.onclick=()=>{if(!confirm('Taak verwijderen?'))return;r.tasks=r.tasks.filter(x=>x.id!==t.id);if(state.runningTimer&&state.runningTimer.taskId===t.id)state.runningTimer=null;saveRender();};row.append(label,edit,up,del);return row;}
function setEdit(mode,id){state.editMode=mode;state.editingId=id||null;}
function closeDialogs(){document.querySelectorAll('dialog[open]').forEach(d=>d.close());}
function setMode(mode){const c=child();if(!c)return;c.moveMode=mode==='click'?'click':'drag';saveRender();}
function openChild(mode){const c=child();setEdit(mode==='edit'?'edit-child':'add-child',c&&c.id);$('childDialogTitle').textContent=mode==='edit'?'Kind wijzigen':'Kind toevoegen';$('childName').value=mode==='edit'&&c?c.name:'';$('childIcon').value=mode==='edit'&&c?c.icon:'';$('childDialog').showModal();}
function openRoutine(mode){const c=ensureChild(),r=routine();if(!c)return;setEdit(mode==='edit'?'edit-routine':'add-routine',r&&r.id);$('routineDialogTitle').textContent=mode==='edit'?'Routine wijzigen':'Routine toevoegen';$('routineName').value=mode==='edit'&&r?r.name:'';$('routineDialogMessage').value=mode==='edit'&&r?messagesToText(r.messages,r.name):messagesToText(null,$('routineName').value);$('routineDialog').showModal();}
function openTask(mode,id){const r=ensureRoutine();if(!r)return;const t=id?r.tasks.find(x=>x.id===id):null;setEdit(mode==='edit'?'edit-task':'add-task',t&&t.id);$('taskDialogTitle').textContent=mode==='edit'?'Taak wijzigen':'Taak toevoegen';$('taskName').value=t?t.name:'';$('taskIcon').value=t?t.icon:'';$('taskMinutes').value=t&&t.minutes?t.minutes:'';$('taskDialog').showModal();}
function submitChild(e){e.preventDefault();const name=$('childName').value.trim(),icon=$('childIcon').value.trim()||'⭐';if(!name)return;if(state.editMode==='edit-child'){const c=child();if(!c)return;c.name=name;c.icon=icon;}else{const c={id:uid(),name,icon,moveMode:'click',routines:[]};state.children.push(c);state.activeChildId=c.id;D.home.classList.remove('on');D.routineScreen.classList.add('on');}closeDialogs();setEdit(null);saveRender();}
function submitRoutine(e){e.preventDefault();const c=ensureChild(),name=$('routineName').value.trim();if(!c||!name)return;const messages=normalizeMessages($('routineDialogMessage').value,name);if(state.editMode==='edit-routine'){const r=routine();if(!r)return;r.name=name;r.messages=messages;}else{const r={id:uid(),name,messages,tasks:[]};c.routines.push(r);state.activeRoutineByChild[c.id]=r.id;D.home.classList.remove('on');D.routineScreen.classList.add('on');}closeDialogs();setEdit(null);saveRender();}
function submitTask(e){e.preventDefault();const r=ensureRoutine(),name=$('taskName').value.trim(),icon=$('taskIcon').value.trim()||'⭐',minutes=Number($('taskMinutes').value||0);if(!r||!name)return;if(state.editMode==='edit-task'){const t=r.tasks.find(x=>x.id===state.editingId);if(!t)return;t.name=name;t.icon=icon;t.minutes=minutes;t.timeUp=false;if(state.runningTimer&&state.runningTimer.taskId===t.id)state.runningTimer=null;}else r.tasks.push(newTask(name,icon,minutes));closeDialogs();setEdit(null);saveRender();}
function moveTask(id,status){const r=routine();if(!r)return;const t=r.tasks.find(x=>x.id===id);if(!t)return;const wasDone=t.status==='done';const willDone=status==='done';t.status=willDone?'done':'todo';t.timeUp=false;if(state.runningTimer&&state.runningTimer.taskId===id)state.runningTimer=null;const routineComplete=r.tasks.length>0&&r.tasks.every(x=>x.status==='done');saveRender();if(willDone&&!wasDone&&routineComplete)celebrateRoutine();}
function resetRoutine(){const r=routine();if(!r)return;r.tasks.forEach(t=>{t.status='todo';t.timeUp=false;});state.runningTimer=null;saveRender();}
function deleteChild(){const c=child();if(!c||!confirm('Kind verwijderen?'))return;state.children=state.children.filter(x=>x.id!==c.id);delete state.activeRoutineByChild[c.id];state.activeChildId=null;state.runningTimer=null;D.home.classList.add('on');D.routineScreen.classList.remove('on');saveRender();}
function deleteRoutine(){const c=child(),r=routine();if(!c){alert('Kies eerst een kind.');return;}if(!r){alert('Er is geen routine om te verwijderen.');return;}if(!confirm('Routine verwijderen?'))return;c.routines=c.routines.filter(x=>x.id!==r.id);state.activeRoutineByChild[c.id]=c.routines[0]?c.routines[0].id:null;state.runningTimer=null;saveRender();}
function toggleTimer(id){const r=routine();if(!r)return;const t=r.tasks.find(x=>x.id===id);if(!t||!t.minutes)return;t.timeUp=false;state.runningTimer=state.runningTimer&&state.runningTimer.taskId===id?null:{taskId:id,endsAt:Date.now()+t.minutes*60000};saveRender();}
function renderTimers(){clearInterval(timer);updateTimers();timer=setInterval(updateTimers,1000);}
function updateTimers(){const run=state.runningTimer;document.querySelectorAll('[data-timer]').forEach(btn=>{const id=btn.dataset.timer,t=findTask(id);if(!t)return;if(run&&run.taskId===id){const ms=Math.max(0,run.endsAt-Date.now()),total=Math.ceil(ms/1000),m=Math.floor(total/60),s=String(total%60).padStart(2,'0');btn.textContent=m+':'+s;btn.classList.add('running');btn.classList.remove('timeup');if(ms<=0){state.runningTimer=null;t.timeUp=true;save();btn.textContent='Tijd!';btn.classList.remove('running');btn.classList.add('timeup');}}else{btn.textContent=t.timeUp?'Tijd!':t.minutes+':00';btn.classList.remove('running');btn.classList.toggle('timeup',!!t.timeUp);}});}
function celebrationThemes(){return[
  {name:'rainbow',base:['rainbow'],objects:['🦄','🦄','🦄'],rain:['⭐','✨','🌟','🎉','💖','🌈']},
  {name:'space',base:['planet'],objects:['🚀','🛸','👩‍🚀'],rain:['⭐','🌟','🪐','☄️','✨']},
  {name:'ocean',base:['waves'],objects:['🐬','🐙','🐠'],rain:['💧','🐚','⭐','🫧','✨']},
  {name:'jungle',base:['jungleHill'],objects:['🦖','🐒','🦜'],rain:['🍃','🌟','🌸','✨','🎉']},
  {name:'royal',base:['castle'],objects:['👑','🦄','🏰'],rain:['💎','✨','⭐','💖','🌈']}
];}
function addEl(cls,text){const el=document.createElement('div');el.className=cls;if(text)el.textContent=text;D.celebrations.appendChild(el);return el;}
function celebrateRoutine(){const r=routine(),themes=celebrationThemes(),theme=themes[Math.floor(Math.random()*themes.length)];clear(D.celebrations);D.celebrations.className='celebrations on theme-'+theme.name;
  theme.base.forEach(cls=>addEl(cls,cls==='castle'?'🏰':''));
  [['18%','28%'],['78%','22%'],['28%','68%'],['68%','58%']].forEach((p,i)=>{const f=addEl('firework');f.style.left=p[0];f.style.top=p[1];f.style.animationDelay=(i*.23)+'s';});
  theme.objects.forEach((emoji,i)=>addEl('themeObj o'+(i+1),emoji));
  theme.rain.forEach(emoji=>{for(let j=0;j<5;j++){const s=addEl('starRain',emoji);s.style.left=(Math.random()*100)+'vw';s.style.animationDelay=(Math.random()*2.5)+'s';s.style.fontSize=(1.3+Math.random()*1.5)+'rem';}});
  const msg=addEl('skyMsg',randomMessage(r));
  const btn=document.createElement('button');btn.className='closeCelebration';btn.textContent='Sluiten';btn.onclick=()=>{D.celebrations.className='celebrations';clear(D.celebrations);};D.celebrations.appendChild(btn);
}
function findTask(id){for(const c of state.children)for(const r of c.routines){const t=r.tasks.find(x=>x.id===id);if(t)return t;}return null;}
function init(){try{state=load();cache();bind();render();console.info('Mijn Routine geladen');}catch(err){console.error(err);document.body.appendChild(empty('Fout bij laden: '+err.message));}}
init();
</script>
</body>
